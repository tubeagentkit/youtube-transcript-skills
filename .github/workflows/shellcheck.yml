name: ShellCheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck 0.11.0
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/shellcheck.XXXXXX")"
          archive="${tool_dir}/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$tool_dir"
          echo "${tool_dir}/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          "${tool_dir}/shellcheck-v0.11.0/shellcheck" --version

      - name: Check every shell script under skills
        run: |
          set -euo pipefail
          find skills -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --external-sources --source-path=SCRIPTDIR
